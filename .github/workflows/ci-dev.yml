name: Test Org Runner

on: [push]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  org-runner-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Running on organization-level self-hosted runner!"

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: org-runner-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/visiobook-esp/repo-test-infra-dev:latest ./poc

      - name: Push Docker image
        run: |
          docker push ghcr.io/visiobook-esp/repo-test-infra-dev:latest
    
  minikube:
    name: 🏗️ Deploy & Test ALL Charts on Minikube
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="v1.30.1"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.30.1

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Clone Charts from Infra Repo
        run : |
          git clone https://github.com/VisioBook-ESP/infra-helm-charts.git
          pwd
          ls -la infra-helm-charts/environnement/dev/charts

      - name: Deploy Chart
        run : |
          helm install my-app infra-helm-charts/environnement/dev/charts/nginx-test/

      - name: Wait for Pods to be Ready and Test Service
        run: |
          release="my-app"
          namespace="default" # change si ton chart déploie ailleurs

          echo "⏳ Checking if all pods for $release are running..."

          ATTEMPTS=0
          MAX_ATTEMPTS=10
          SLEEP_TIME=10
          READY=false

          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            echo "🔄 Attempt $((ATTEMPTS+1))/$MAX_ATTEMPTS..."

            NOT_READY=$(kubectl get pods -l "app.kubernetes.io/instance=$release" -n $namespace \
              --no-headers | grep -v 'Running' || true)

            if [ -z "$NOT_READY" ]; then
              echo "✅ All pods for $release are running!"
              READY=true
              break
            fi

            echo "⏳ Some pods are not yet running. Waiting $SLEEP_TIME seconds..."
            ATTEMPTS=$((ATTEMPTS+1))
            sleep $SLEEP_TIME
          done

          if [ "$READY" != "true" ]; then
            echo "❌ Pods for $release did not reach Running state in time."
            kubectl get pods -l "app.kubernetes.io/instance=$release" -n $namespace
            exit 1
          fi

          svc=$(kubectl get svc -l "app.kubernetes.io/instance=$release" -n $namespace -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -n "$svc" ]; then
            echo "🔍 Service found for $release: $svc"

            kubectl port-forward svc/$svc 8080:80 -n $namespace >/dev/null 2>&1 &
            PF_PID=$!
            sleep 5

            echo "🌐 Testing service for $release with 10 retries every 10 seconds..."
            for i in {1..10}; do
              if curl --silent --max-time 5 http://127.0.0.1:8080; then
                echo "✅ Service is responding!"
                SUCCESS=true
                break
              else
                echo "⚠️ Attempt $i/10 failed, retrying in 10 seconds..."
                sleep 10
              fi
            done

            kill $PF_PID || true

            if [ "$SUCCESS" != "true" ]; then
              echo "❌ Service did not respond after 10 attempts."
              exit 1
            fi
          else
            echo "⚠️ No service found for $release, skipping curl test"
          fi
