name: Test Org Runner

on: [push]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  org-runner-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Running on organization-level self-hosted runner!"

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: org-runner-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/visiobook-esp/repo-test-infra-dev:latest ./poc

      - name: Push Docker image
        run: |
          docker push ghcr.io/visiobook-esp/repo-test-infra-dev:latest
    
  minikube:
    name: 🏗️ Deploy & Test ALL Charts on Minikube
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="v1.30.1"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.30.1

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Clone Charts from Infra Repo
        run : |
          git clone https://github.com/VisioBook-ESP/infra-helm-charts.git
          pwd
          ls -la infra-helm-charts/environnement/dev/charts

      - name: Deploy Chart
        run : |
          helm install my-app infra-helm-charts/environnement/dev/charts/nginx-test/

      - name: Wait for Pods to be Ready and Test Service
        run: |
          release="my-app"

          echo "⏳ Waiting for pods to be ready for release: $release"
          kubectl wait --for=condition=ready pod -l "app.kubernetes.io/instance=$release" --timeout=120s

          svc=$(kubectl get svc -l "app.kubernetes.io/instance=$release" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -n "$svc" ]; then
            echo "🔍 Service found for $release: $svc"

            # Port-forward dans un process en arrière-plan
            kubectl port-forward svc/$svc 8080:80 >/dev/null 2>&1 &
            PF_PID=$!

            # Pause le temps que le forward se mette en place
            sleep 5

            echo "🌐 Testing service for $release..."
            if curl --max-time 10 --retry 5 --retry-delay 5 http://127.0.0.1:8080; then
              echo "✅ Service is responding!"
            else
              echo "⚠️ Service did not respond correctly!"
            fi

            # Nettoyage du port-forward
            kill $PF_PID || true
          else
            echo "⚠️ No service found for $release, skipping curl test"
          fi
